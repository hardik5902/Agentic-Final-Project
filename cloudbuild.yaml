substitutions:
  _REGION: us-central1
  _DATABASE_URL: ''

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/quoteflow-backend', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/quoteflow-backend']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'quoteflow-backend'
      - '--image=gcr.io/$PROJECT_ID/quoteflow-backend'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=1,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},SECRET_KEY=dev-secret-change-in-prod,SENDGRID_API_KEY=,DATABASE_URL=${_DATABASE_URL}'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:rfq-agentic-final'
