[project]
name = "quoteflow-backend"
version = "0.1.0"
description = "QuoteFlow API — AI-native buyer-side RFQ platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Database
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Validation
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "email-validator>=2.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",

    # Google Cloud / AI
    # google-adk brings in google-cloud-aiplatform transitively;
    # vertexai is a thin alias package inside google-cloud-aiplatform.
    "google-adk>=1.32.0",
    "google-cloud-aiplatform[adk]>=1.71.0",
    "google-cloud-storage>=2.18.2",
    "google-cloud-tasks>=2.16.5",
    "google-cloud-secret-manager>=2.20.2",

    # Redis
    "redis>=5.1.0",

    # Email
    "sendgrid>=6.11.0",

    # PDF
    "weasyprint>=62.3",

    # HTTP client (currency API)
    "httpx>=0.27.2",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",

    # Monitoring
    "sentry-sdk[fastapi]>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
